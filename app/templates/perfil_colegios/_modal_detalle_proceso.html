<div class="modal fade" id="modalDetalleProceso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white py-2 shadow-sm">
                <h6 class="modal-title"><i class="fas fa-file-contract me-2"></i>Expediente del Proceso</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4">
                <div class="row g-3">
                    <div class="col-12 mb-2">
                        <p class="text-primary fw-bold small text-uppercase mb-0">Detalles de la Contratación</p>
                        <hr class="mt-1 mb-2 opacity-25">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="text-muted d-block small">Vigencia</label>
                        <span id="det_vigencia" class="text-dark fw-bold">-</span>
                    </div>
                    <div class="col-md-9">
                        <label class="text-muted d-block small">Tipo de Contrato</label>
                        <span id="det_tipo_contrato" class="text-primary fw-bold text-uppercase">-</span>
                    </div>
                    <div class="col-12">
                        <label class="text-muted d-block small">Objeto Detallado</label>
                        <div class="p-2 border rounded bg-light small" id="det_objeto" style="min-height: 50px;">-</div>
                    </div>

                    <div class="col-12 mt-4 mb-2">
                        <p class="text-primary fw-bold small text-uppercase mb-0">Información del Contratista</p>
                        <hr class="mt-1 mb-2 opacity-25">
                    </div>
                    
                    <div class="col-md-8">
                        <label class="text-muted d-block small">Nombre / Razón Social</label>
                        <span id="det_proveedor" class="text-dark fw-medium">-</span>
                    </div>
                    <div class="col-md-4">
                        <label class="text-muted d-block small">Identificación (NIT/CC)</label>
                        <span id="det_nit_proveedor" class="text-dark fw-medium">-</span>
                    </div>

                    <div class="col-12 mt-4">
                        <div class="card border-0 bg-light">
                            <div class="card-body py-3 px-4 shadow-sm rounded">

                                    <div class="col-md-6 border-end text-center">

                                        <span id="det_valor" class="text-success fw-bold h4 mb-0">-</span>
                                    </div>
                                    <div class="col-md-6 text-center">
                                        <label class="text-muted small fw-bold d-block text-uppercase">Plazo de Ejecución</label>
                                        <span id="det_plazo" class="text-dark fw-bold h5 mb-0">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 text-end mt-3">
                        <small class="text-muted italic">Registrado el: <span id="det_fecha">-</span></small>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer border-0 bg-light py-2">
                <button type="button" class="btn btn-secondary btn-sm px-4" data-bs-dismiss="modal">Cerrar Vista</button>
            </div>
        </div>
    </div>
</div>
