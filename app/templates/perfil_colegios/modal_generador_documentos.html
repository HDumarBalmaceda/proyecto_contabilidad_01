

<div class="modal fade" id="modalGeneradorDocs" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white py-3">
                <h5 class="modal-title d-flex align-items-center">
                    <i class="bi bi-file-earmark-medical-fill me-2 text-warning"></i>
                    Configuración de Expediente Contractual
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-0">
                <ul class="nav nav-pills nav-fill bg-light p-2 border-bottom" id="docTabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active small fw-bold" data-bs-toggle="tab" href="#tab-basicos">1. GENERAL / CDP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link small fw-bold" data-bs-toggle="tab" href="#tab-cronograma">2. CRONOGRAMA</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link small fw-bold" data-bs-toggle="tab" href="#tab-items">3. ÍTEMS/TABLA</a>
                    </li>
                </ul>

                <form id="formExpedienteCompleto" class="p-4">
                    <input type="hidden" id="colegio_id_input" value="{{ colegio.id }}">
                    <input type="hidden" id="modalVigenciaInput" name="vigencia">
                    
                    <div class="tab-content">
                        
                        <div class="tab-pane fade show active" id="tab-basicos">
    <div class="row g-3">
        <div class="col-md-7">
            <label class="form-label fw-bold small">Proveedor(es) Vinculado(s)</label>
            <select class="form-select border-primary" name="proveedor_id" required>
                <option value="" disabled selected>Seleccione el proveedor...</option>
                {% for p in colegio.proveedores %}
                    <option value="{{ p.id }}">{{ p.primer_nombre }} {{ p.primer_apellido }} | {{ p.razon_social or 'Persona Natural' }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-5">
            <label class="form-label fw-bold small">Tipo de Contrato</label>
            <select class="form-select" name="tipo_contrato">
                <option value="SUMINISTROS">Suministros</option>
                <option value="PRESTACION DE SERVICIOS">Prestación de Servicios</option>
                <option value="HONORARIOS">Honorarios</option>
            </select>
        </div>

        <div class="col-md-6">
            <div class="p-3 bg-light rounded border h-100">
                <label class="fw-bold text-primary small d-block mb-2">
                    <i class="bi bi-bank me-1"></i>INFORMACIÓN PRESUPUESTAL (CDP)
                </label>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="small fw-bold">Número de CDP</label>
                        <input type="text" name="cdp_numero" class="form-control form-control-sm" placeholder="Ej: 001">
                    </div>
                    <div class="col-6">
                        <label class="small fw-bold">Código Presupuestal</label>
                        <input type="text" name="cod_presupuestal" class="form-control form-control-sm" placeholder="Rubro">
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="h-100">
                <label class="form-label fw-bold small">Objeto del Contrato</label>
                <textarea class="form-control" name="objeto_desc" style="height: calc(100% - 30px);" placeholder="Descripción del contrato..." maxlength="500"></textarea>
            </div>
        </div>
    </div>
</div>

                        <div class="tab-pane fade" id="tab-cronograma">
                            <div class="alert alert-warning py-2 small mb-3">
                                <i class="bi bi-magic me-2"></i>Al cambiar la <b>Fecha de Elaboración</b>, las demás se calculan automáticamente.
                            </div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="small fw-bold">Fecha Elaboración</label>
                                    <input type="date" id="f_elaboracion" name="f_elaboracion" class="form-control" onchange="calcularCronograma()">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Fecha Publicación</label>
                                    <input type="date" id="f_publicacion" name="f_publicacion" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Fecha Recepción</label>
                                    <input type="date" id="f_recepcion" name="f_recepcion" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Fecha Cierre</label>
                                    <input type="date" id="f_cierre" name="f_cierre" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Fecha Verificación</label>
                                    <input type="date" id="f_verificacion" name="f_verificacion" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Fecha Firma</label>
                                    <input type="date" id="f_firma" name="f_firma" class="form-control">
                                </div>
                                <div class="col-12">
                                    <label class="small fw-bold">Plazo de Ejecución (Texto)</label>
                                    <input type="text" name="plazo_txt" class="form-control" placeholder="Ej: 04 DIAS">
                                </div>
                            </div>
                        </div>
                            <div class="tab-pane fade" id="tab-items">
                                      <div class="table-responsive">
                                            <table class="table table-bordered table-sm">
                                                       <thead class="table-dark">
                                                             <tr class="small text-center">
                                                                   <th style="width: 10%;">CANT.</th>
                                                                   <th style="width: 20%;">CÓD. CLASIFICADOR</th>
                                                                   <th style="width: 40%;">DESCRIPCIÓN</th>
                                                                   <th style="width: 15%;">V. UNITARIO</th>
                                                                   <th style="width: 15%;">V. TOTAL</th>
                                                                   <th style="width: 5%;"></th>
                                                             </tr>
                                                       </thead>
                                                   <tbody id="cuerpoTablaItems">
                                                     <tr>
                                                      <td><input type="number" name="cant[]" class="form-control form-control-sm text-center" value="1" onchange="recalcularFila(this)"></td>
                                                      <td><input type="text" name="cod_clasificador[]" class="form-control form-control-sm" placeholder="Ej: 44121708"></td>
                                                      <td><input type="text" name="desc[]" class="form-control form-control-sm" placeholder="Nombre del servicio"></td>
                                                      <td><input type="number" name="v_unit[]" class="form-control form-control-sm text-end" value="0" onchange="recalcularFila(this)"></td>
                                                      <td><input type="number" name="v_total[]" class="form-control form-control-sm text-end bg-light" readonly value="0"></td>
                                                      <td class="text-center text-muted">-</td>
                                                     </tr>
                                                  </tbody>
                                          </table>
                               </div>

                                   <div class="d-flex justify-content-between align-items-center mt-3 p-2 bg-light border rounded">
                                             <div class="d-flex gap-2">
                                                  <button type="button" class="btn btn-outline-primary btn-sm" onclick="agregarFilaItem()">
                                                       <i class="bi bi-plus-circle me-1"></i> Agregar Ítem
                                                 </button>
                                                                <a href="https://operaciones.colombiacompra.gov.co/clasificador-de-bienes-y-servicios" target="_blank" class="btn btn-outline-info btn-sm">
                                                       <i class="bi bi-search me-1"></i> Consultar Códigos
                                                             </a>
                                                                   </div>

                                                                        <div class="d-flex align-items-center">
                                                                            <span class="fw-bold me-2">GRAN TOTAL:</span>
                                                                                 <div class="input-group input-group-sm" style="width: 180px;">
                                                                                      <span class="input-group-text bg-dark text-white">$</span>
                                                                                        <input type="text" id="gran_total_display" class="form-control fw-bold text-end bg-white" readonly value="0">
                                                                                </div>
                                                             </div>
                                                       </div>
                                                  </div>

                                             </div>
                 </form>
            </div>
            
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-success px-4" onclick="procesarExpediente()">
                    <i class="bi bi-file-earmark-zip me-2"></i> Generar Expediente
                </button>

            </div>
        </div>
    </div>
</div>
